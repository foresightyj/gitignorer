# cargo-features = ["edition2024"]

[package]
name = "gitignorer"
version = "0.1.0"
edition = "2024"
authors = ["foresightyj"]
license = "MIT"
homepage = "https://github.com/foresightyj/gitignorer"
description = "A CLI tool to generate .gitignore files interactively"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
colored = "3.0.0"
glob = "0.3.3"
home = "0.5.11"
inquire = "0.9.1"
lazy_static = "1.5.0"
reqwest = "0.12.23"
tokio = { version = "1.47.1", features = ["full", "rt-multi-thread"] }
tokio-stream = { version = "0.1.17", features = ["full"] }
zip = "7.0.0"
